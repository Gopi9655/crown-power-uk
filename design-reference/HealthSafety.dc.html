<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;}body{margin:0;background:#fff;}a{text-decoration:none;color:inherit;}</style>
</helmet>
<div style="font-family:Inter,sans-serif;color:#0C1722;">
<dc-import name="Header" variant="solid" hint-size="100%,76px"></dc-import>
<dc-import name="LegalLayout" eyebrow="Company" title="Health &amp; Safety" summary="Safe working practice is fundamental to how Crown Power operates in the electrical power industry." updated="Last reviewed 2025 · policy detail to be confirmed" review-note="{{ reviewNote }}" contact-heading="Health &amp; safety enquiries" contact-note="For questions relating to our health and safety practices, please contact us." contact-email="info@crownpoweruk.co.uk" sections="{{ sections }}" related="{{ related }}" hint-size="100%,1600px"></dc-import>
<dc-import name="Footer" hint-size="100%,520px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      reviewNote: 'This page sets out Crown Power\u2019s health and safety approach in general terms. Formal policy documents, named responsibilities, procedures and any certifications must be confirmed by the company before publication. We do not claim certification or approval that has not been verified.',
      sections: [
        { id:'statement', h:'1. Policy statement', paras:['Working with electrical power carries genuine risk. Crown Power is committed to protecting the health, safety and wellbeing of its employees, placement participants, contractors, clients and the public affected by our work.','Safety is treated as an integral part of every engagement, not a box-ticking exercise.'] },
        { id:'scope', h:'2. Scope', paras:['This commitment applies across our activities — from design and installation through to maintenance — and to everyone working on our behalf.'] },
        { id:'commitment', h:'3. Our commitment', paras:['We aim to:'], list:['Provide a safe working environment and safe systems of work','Identify hazards and assess and control risks','Ensure people are competent, informed and appropriately supervised','Comply with relevant health and safety legislation and good practice','Continually review and improve our safety performance'] },
        { id:'responsibilities', h:'4. Responsibilities', paras:['Health and safety is a shared responsibility. Management is responsible for providing safe systems of work and resources; everyone working with or for Crown Power is responsible for following safe practices and raising concerns.'] },
        { id:'practices', h:'5. Safe working practices', paras:['Our approach includes risk assessment, appropriate use of protective equipment, safe isolation and working procedures, and clear communication on site. Training and safety awareness underpin all technical development.'] },
        { id:'reporting', h:'6. Reporting & escalation', paras:['We encourage the prompt reporting of hazards, near misses and incidents so that they can be addressed. Concerns can be raised with management or through the contact route below.'] },
      ],
      related: [
        { label:'Training & Development', href:'Training.dc.html' },
        { label:'About Crown Power', href:'About.dc.html' },
        { label:'Legal Department', href:'Legal.dc.html' },
        { label:'Contact', href:'Contact.dc.html' },
      ],
    };
  }
}
</script>
</body>
</html>
