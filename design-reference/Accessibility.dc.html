<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;}body{margin:0;background:#fff;}a{text-decoration:none;color:inherit;}</style>
</helmet>
<div style="font-family:Inter,sans-serif;color:#0C1722;">
<dc-import name="Header" variant="solid" hint-size="100%,76px"></dc-import>
<dc-import name="LegalLayout" eyebrow="Legal" title="Accessibility" summary="Our commitment to making this website usable for as many people as possible." updated="Last reviewed 2025" review-note="{{ reviewNote }}" contact-heading="Accessibility feedback" contact-note="If you experience any difficulty using this site, or need information in an alternative format, please tell us and we will do our best to help." contact-email="info@crownpoweruk.co.uk" sections="{{ sections }}" related="{{ related }}" hint-size="100%,1500px"></dc-import>
<dc-import name="Footer" hint-size="100%,520px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      reviewNote: 'Any accessibility instructions carried over from the previous website that referred to older browser behaviour no longer apply to this redesigned site and have been set aside for revision. This statement describes the accessibility approach of the new website.',
      sections: [
        { id:'commitment', h:'1. Our commitment', paras:['Crown Power is committed to making its website accessible to as many people as possible, regardless of ability or the technology they use. We treat accessibility as part of good design, not an afterthought.'] },
        { id:'standard', h:'2. Standard we aim for', paras:['The redesigned website is built with the Web Content Accessibility Guidelines (WCAG) 2.2 Level AA as its target. We consider accessibility throughout design and development rather than at the end.'] },
        { id:'features', h:'3. What we do', paras:['Accessibility features built into the site include:'], list:['Clear, consistent navigation and page structure','Text and interface colours chosen to meet contrast guidance','Full keyboard operability with visible focus states','Support for the "reduced motion" setting so animation can be minimised','Readable text sizes and layouts that adapt to zoom and smaller screens','Meaningful text alternatives for images that carry information'] },
        { id:'limitations', h:'4. Known limitations', paras:['We continue to test and improve the site. Some third-party content or embedded material may not yet fully meet our target standard; where we identify issues, we work to address them.'] },
        { id:'feedback', h:'5. Feedback', paras:['We welcome feedback on the accessibility of this website. If something is difficult to use, or you need content in another format, please contact us using the details below.'] },
      ],
      related: [
        { label:'Privacy Policy', href:'PrivacyPolicy.dc.html' },
        { label:'Cookie Policy', href:'CookiePolicy.dc.html' },
        { label:'Terms & Conditions', href:'TermsConditions.dc.html' },
        { label:'Contact', href:'Contact.dc.html' },
      ],
    };
  }
}
</script>
</body>
</html>
